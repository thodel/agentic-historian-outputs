<!--
  Overrides minima's _includes/head.html (2.5.x) for one reason: to honour a
  page's `robots` front matter.

  Tombstones — withdrawn outputs (#194) and entity pages no longer supported by
  any record — have declared `robots: noindex` since they were introduced, but
  minima's head emits no robots meta, so the declaration never reached a
  crawler. Excluding them from sitemap.xml stops them being advertised; it does
  not ask a crawler that already knows the URL to drop it. This does.

  Everything else here is minima 2.5.2's head verbatim. Keep it that way: when
  the theme's head gains something, copy it across rather than diverging.
-->
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- if page.robots -%}
  <meta name="robots" content="{{ page.robots }}">
  {%- endif -%}
  {%- seo -%}
  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  {%- feed_meta -%}
  {%- if jekyll.environment == 'production' and site.google_analytics -%}
    {%- include google-analytics.html -%}
  {%- endif -%}
</head>
