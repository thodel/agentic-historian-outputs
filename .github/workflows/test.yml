name: Test generators

on:
  pull_request:
  push:
    branches: [main]
  # Lets the suite be re-run against the current tip on demand (issue #200).
  # Pushes made with GITHUB_TOKEN never trigger workflows, so the catalogue
  # index job cannot validate its own commit by pushing — it dispatches this
  # workflow instead (issue #199).
  #
  # Keep exactly one workflow_dispatch key here: GitHub rejects a workflow with
  # duplicate keys and the run fails at startup in 0s, before any job appears.
  # A duplicate reached main once, when two branches each added the trigger at
  # a different position and git merged both without a conflict.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Generated pages include pipeline history; shallow PR merge refs
          # would otherwise replace it with the synthetic merge commit.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/*.mjs
      - run: python scripts/build_index.py
      - run: git diff --exit-code
      - run: node --check docs/assets/catalogue.js
      - run: node --check docs/assets/rec-viewer.js
      - run: node --check docs/assets/workspace.js
      - run: node --check docs/assets/evidence-viewer.js
      - run: node --check docs/assets/page-sync.js
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Generate HTML fixtures
        run: node generate-fixtures.mjs
      - name: Run behavioral tests
        run: node --test tests/behavioural/*.mjs
