name: Test generators

on:
  pull_request:
  push:
    branches: [main]
  # Conventional `Publish ...` pushes are skipped by the jobs below and
  # validated explicitly by build-index.yml after the generated refresh.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-generators-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-unit:
    name: Python unit tests
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Publish ')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v

  node-unit:
    name: Node unit and syntax tests
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Publish ')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node --test tests/*.mjs
      - name: Check deployed JavaScript syntax
        run: |
          node --check docs/assets/catalogue.js
          node --check docs/assets/rec-viewer.js
          node --check docs/assets/workspace.js
          node --check docs/assets/evidence-viewer.js
          node --check docs/assets/page-sync.js

  generated-output:
    name: Generated output is current
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Publish ')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/build_index.py
      - name: Reject generated-output drift
        run: git diff --exit-code

  browser-behaviour:
    name: Browser behaviour
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Publish ')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Generate HTML fixtures
        run: node generate-fixtures.mjs
      - name: Run behavioral tests
        run: node --test tests/behavioural/*.mjs
      - name: Capture browser diagnostics
        if: failure()
        continue-on-error: true
        run: node scripts/capture_behavioural_diagnostics.mjs
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-behaviour-diagnostics
          path: test-results/browser/
          if-no-files-found: warn
          retention-days: 14
