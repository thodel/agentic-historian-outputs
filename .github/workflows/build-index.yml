name: Build catalogue index

# Regenerate docs/index.md from every docs/*/pipeline.json whenever the publisher
# commits a new document. The actor guard prevents the Action's own index commit
# from retriggering it (no infinite loop).

on:
  push:
    branches: [main]
    paths:
      - "docs/**/pipeline.json"

permissions:
  contents: write
  # Needed to dispatch "Test generators" against the refreshed tip (issue #199).
  actions: write

jobs:
  build-index:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The catalogue derives creation dates from the first commit that
          # introduced each pipeline.json, so it needs the complete history.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Rebuild until the tree settles. The first rebuild can still leave a
      # diff, because a page resolves its provenance relative to HEAD and the
      # refresh commit does not exist while the build that writes the page is
      # running. Building once and stopping commits that unstable state and
      # leaves the clean-diff gate red until someone regenerates by hand — how
      # docs/saa-0428/index.md stayed stale for a week (#241).
      - name: Refresh generated output until it settles
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          refreshed=false
          for pass in 1 2 3; do
            python scripts/build_index.py
            git add docs
            if git diff --cached --quiet; then
              echo "settled after ${pass} build(s)"
              break
            fi
            if [ "$pass" = 3 ]; then
              echo "::error::generated output did not settle in 3 builds"
              git --no-pager diff --cached --stat
              exit 1
            fi
            git commit -m "build: refresh catalogue index"
            refreshed=true
          done
          if [ "$refreshed" = true ]; then
            git push
          fi
          echo "refreshed=$refreshed" >> "$GITHUB_OUTPUT"
      # Validate exactly the final tip. If the index changed this is the bot's
      # refresh commit; otherwise it is the original, already-current publish.
      # test.yml intentionally does not run on the transient push itself.
      - name: Validate the final tip
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run test.yml --ref main
