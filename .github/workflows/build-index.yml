name: Build catalogue index

# Regenerate docs/index.md from every docs/*/pipeline.json whenever the publisher
# commits a new document. The actor guard prevents the Action's own index commit
# from retriggering it (no infinite loop).

on:
  push:
    branches: [main]
    paths:
      - "docs/**/pipeline.json"

permissions:
  contents: write
  # Needed to dispatch "Test generators" against the refreshed tip (issue #199).
  actions: write

jobs:
  build-index:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The catalogue derives creation dates from the first commit that
          # introduced each pipeline.json, so it needs the complete history.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/build_index.py
      - name: Commit refreshed index
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "refreshed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "build: refresh catalogue index"
            git push
            echo "refreshed=true" >> "$GITHUB_OUTPUT"
          fi
      # Validate exactly the final tip. If the index changed this is the bot's
      # refresh commit; otherwise it is the original, already-current publish.
      # test.yml intentionally does not run on the transient push itself.
      - name: Validate the final tip
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run test.yml --ref main
